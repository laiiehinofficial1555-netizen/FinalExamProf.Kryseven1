<!DOCTYPE html>
<html lang="km">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>គណនាថ្លៃផ្ញើរយានជំនិះ</title>
        <link rel="stylesheet" href="./Parking.css">
    </head>
    <body>
        <div class="card">
            <h1>គណនាថ្លៃផ្ញើរយានជំនិះ</h1>

            <div class="row">
                <label for="vehicle">ជ្រើសរើស យានជំនិះ</label>
                <select id="vehicle">
                    <option value="car">ឡាន</option>
                    <option value="moto">ម៉ូតូ</option>
                </select>
            </div>
            <div class="row">
                <label for="timeIn">ម៉ោងចូល</label>
                <input type="time" id="timeIn">
            </div>
            <div class="row">
                <label for="timeOut">ម៉ោងចេញ</label>
                <input type="time" id="timeOut">
            </div>
            <div class="row">
                <label for="riel">ថ្លៃផ្ញើរ រៀល</label>
                <input type="text" id="riel" readonly placeholder="៛">
            </div>
            <div class="row">
                <label for="usd">ថ្លៃផ្ញើរ ដុល្លា</label>
                <input type="text" id="usd" readonly placeholder="$">
            </div>

            <p class="error" id="error"></p>
            <button id="calc">គណនា</button>
        </div>
        <script src="./Parking.js"></script>
    </body>
</html>
